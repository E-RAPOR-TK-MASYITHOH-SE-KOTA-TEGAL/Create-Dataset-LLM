<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dashboard AI & Dataset Generator - TK Masyithoh VII</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        :root {
            --bg-main: #0b0f19;
            --bg-panel: #0f172a;
            --bg-card: #1e293b;
            --bg-darker: #020617;
            --border-color: #334155;
            --primary: #0284c7;
            --primary-hover: #0369a1;
            --accent-cyan: #38bdf8;
            --success: #16a34a;
            --danger: #dc2626;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-main);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Custom Modern Scrollbars */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.2); }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }

        /* Navigation Header */
        header {
            background: #111827;
            padding: 8px 16px;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #1f2937;
            gap: 10px;
            z-index: 20;
            min-height: 54px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .brand-title {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--accent-cyan);
            letter-spacing: 0.3px;
            white-space: nowrap;
        }

        .status-pill {
            font-size: 0.7rem;
            padding: 3px 8px;
            border-radius: 9999px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            white-space: nowrap;
        }

        .pill-green { background: #064e3b; color: #34d399; }
        .pill-yellow { background: #713f12; color: #fde047; }
        .pill-red { background: #7f1d1d; color: #f87171; }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        /* Standardized Buttons */
        .tab-btn {
            background: #1e293b;
            color: var(--text-muted);
            border: 1px solid #374151;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 600;
            transition: all 0.15s ease;
            white-space: nowrap;
        }

        .tab-btn:hover { background: #334155; color: #fff; border-color: #475569; }
        .tab-btn.active {
            background: var(--primary) !important;
            color: #fff !important;
            border-color: var(--primary) !important;
            box-shadow: 0 0 10px rgba(2, 132, 199, 0.4);
        }

        .btn-run {
            background: var(--success);
            color: #fff;
            border: none;
            padding: 6px 13px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            transition: all 0.15s ease;
            white-space: nowrap;
        }

        .btn-run:hover { background: #15803d; }

        .btn-stop {
            background: var(--danger);
            color: #fff;
            border: none;
            padding: 6px 11px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.15s ease;
            white-space: nowrap;
        }

        .btn-stop:hover { background: #b91c1c; }

        .btn-logout {
            background: transparent;
            color: #ef4444;
            border: 1px solid #7f1d1d;
            padding: 5px 10px;
            border-radius: 6px;
            font-size: 0.78rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s ease;
            white-space: nowrap;
        }

        .btn-logout:hover { background: #7f1d1d; color: #fff; }

        /* Main Workspace Grid (Desktop default) */
        .workspace {
            flex: 1;
            display: grid;
            grid-template-columns: 55% 45%;
            height: calc(100vh - 54px);
            overflow: hidden;
        }

        .left-col, .right-col {
            display: flex;
            flex-direction: column;
            height: 100%;
            overflow: hidden;
            background: var(--bg-panel);
            position: relative;
        }

        .left-col { border-right: 1px solid #1f2937; }

        /* Section Bar & Control Toolbar */
        .section-bar {
            background: #1e293b;
            padding: 6px 12px;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--text-muted);
            gap: 6px;
            min-height: 38px;
        }

        .screen-toolbar {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .btn-tool {
            background: #334155;
            color: #e2e8f0;
            border: 1px solid #475569;
            padding: 3px 9px;
            border-radius: 4px;
            font-size: 0.74rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s ease;
            white-space: nowrap;
        }

        .btn-tool:hover { background: #475569; color: #fff; }
        .btn-tool.active-on { background: var(--success) !important; color: #fff !important; border-color: var(--success) !important; }
        .btn-tool.active-off { background: var(--danger) !important; color: #fff !important; border-color: var(--danger) !important; }
        .btn-tool.active-mode { background: var(--primary) !important; color: #fff !important; border-color: var(--primary) !important; }

        /* Live Screen Stage Area */
        .screen-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
            position: relative;
            overflow: hidden;
            padding: 6px;
        }

        .screen-stage {
            position: relative;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            max-width: 100%;
            max-height: 100%;
            border-radius: 6px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.7);
        }

        #live-screen {
            max-width: 100%;
            max-height: calc(100vh - 110px);
            object-fit: contain;
            pointer-events: none;
            display: block;
        }

        #screen-overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            outline: none;
        }

        #screen-overlay.mode-anydesk { cursor: crosshair; }
        #screen-overlay.mode-live { cursor: default; }

        .screen-off-placeholder {
            position: absolute;
            inset: 0;
            background: #090d16;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 12px;
            color: #64748b;
            z-index: 5;
            padding: 20px;
            text-align: center;
        }

        .screen-off-placeholder.show { display: flex; }

        /* Terminal Component */
        .terminal-tabs {
            display: flex;
            gap: 4px;
            background: #111827;
            padding: 6px 8px 0 8px;
            border-bottom: 1px solid #1f2937;
            overflow-x: auto;
            align-items: flex-end;
        }

        .term-tab {
            background: #1e293b;
            color: var(--text-muted);
            padding: 6px 12px;
            border-radius: 6px 6px 0 0;
            font-size: 0.78rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid var(--border-color);
            border-bottom: none;
            transition: all 0.15s ease;
            white-space: nowrap;
            user-select: none;
        }

        .term-tab:hover {
            background: #334155 !important;
            color: #f8fafc !important;
        }

        .term-tab.active {
            background: #000000 !important;
            color: #38bdf8 !important;
            border-color: #0284c7 !important;
            font-weight: 700;
            border-top: 3px solid #0284c7 !important;
            box-shadow: 0 -2px 10px rgba(2, 132, 199, 0.25);
        }

        .term-tab.active:hover {
            background: #020617 !important;
            color: #38bdf8 !important;
        }

        .term-close {
            color: #64748b;
            font-weight: bold;
            border: none;
            background: transparent;
            cursor: pointer;
            padding: 0 2px;
        }

        .term-close:hover { color: #ef4444; }

        .btn-add-term {
            background: #1f2937;
            color: var(--accent-cyan);
            border: 1px dashed var(--accent-cyan);
            border-radius: 4px;
            padding: 1px 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.15s ease;
        }

        .btn-add-term:hover { background: var(--primary); color: #fff; border-style: solid; }

        .terminal-body {
            flex: 1;
            background: #000;
            display: flex;
            flex-direction: column;
            padding: 8px;
            overflow: hidden;
        }

        .term-view {
            flex: 1;
            overflow-y: auto;
            font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace;
            font-size: 12.5px;
            color: #4ade80;
            white-space: pre-wrap;
            word-break: break-all;
            line-height: 1.4;
        }

        .term-cmd-bar {
            display: flex;
            gap: 6px;
            margin-top: 6px;
            padding-top: 6px;
            border-top: 1px solid #1e293b;
        }

        .term-cmd-input {
            flex: 1;
            background: #0b0f19;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            color: #f8fafc;
            padding: 6px 10px;
            font-family: 'JetBrains Mono', 'Consolas', monospace;
            outline: none;
            font-size: 12.5px;
        }

        .term-cmd-input:focus { border-color: var(--primary); }

        .term-send-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 6px 13px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.8rem;
            transition: background 0.15s ease;
        }

        .term-send-btn:hover { background: var(--primary-hover); }

        /* Dataset View Tab */
        .dataset-panel {
            flex: 1;
            display: none;
            flex-direction: column;
            background: var(--bg-panel);
            overflow: hidden;
        }

        .dataset-panel.active { display: flex; }

        .dataset-stats {
            background: #1e293b;
            padding: 10px 16px;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            gap: 12px;
        }

        .stat-card { display: flex; flex-direction: column; }
        .stat-val { font-size: 1.3rem; font-weight: 700; color: var(--accent-cyan); }
        .stat-lbl { font-size: 0.72rem; color: var(--text-muted); }

        .progress-box { flex: 1; min-width: 200px; margin: 0 16px; }
        .progress-bar-bg { background: #334155; height: 8px; border-radius: 4px; overflow: hidden; }
        .progress-bar-fill { background: #10b981; height: 100%; width: 0%; transition: width 0.3s; }

        .dataset-list {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .data-card {
            background: #1e293b;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px 14px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.82rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding-bottom: 6px;
        }

        .tag-capaian {
            background: var(--primary);
            color: #fff;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.72rem;
            font-weight: 600;
        }

        .section-label {
            font-size: 0.74rem;
            color: var(--accent-cyan);
            font-weight: bold;
            text-transform: uppercase;
            margin-top: 4px;
        }

        .card-text {
            font-size: 0.84rem;
            color: #e2e8f0;
            line-height: 1.5;
            background: #0b0f19;
            padding: 10px;
            border-radius: 6px;
            white-space: pre-wrap;
            border: 1px solid #1f2937;
        }

        /* =====================================================================
           RESPONSIVE BREAKPOINTS (Mobile & Tablet Optimization)
           ===================================================================== */
        @media (max-width: 980px) {
            body { height: auto; min-height: 100vh; overflow-y: auto; }
            .workspace {
                display: flex;
                flex-direction: column;
                height: auto;
                min-height: calc(100vh - 54px);
            }
            .left-col {
                border-right: none;
                border-bottom: 1px solid #1f2937;
                height: 480px;
                min-height: 400px;
            }
            .right-col {
                height: 420px;
                min-height: 350px;
            }
            #live-screen { max-height: 400px; }
            .progress-box { margin: 8px 0; width: 100%; order: 3; }
        }

        @media (max-width: 640px) {
            header { padding: 8px 12px; }
            .brand-title { font-size: 0.88rem; }
            .status-pill { display: none; } /* Hide pills on small screens to save space */
            .header-actions { width: 100%; justify-content: space-between; gap: 4px; }
            .tab-btn, .btn-run, .btn-stop, .btn-logout { padding: 5px 9px; font-size: 0.74rem; }
            .left-col { height: 380px; }
            .right-col { height: 340px; }
            #live-screen { max-height: 320px; }
        }
    </style>
</head>
<body>
    <!-- MAIN HEADER -->
    <header>
        <div class="brand">
            <span class="brand-title">SKRIPSI DATASET GENERATOR</span>
            <span class="status-pill pill-yellow" id="model-pill">Memuat Model AI...</span>
            <span class="status-pill pill-green" id="socket-pill">ONLINE</span>
        </div>
        <div class="header-actions">
            <button class="tab-btn active" id="btn-tab-monitor" onclick="switchMainTab('monitor')">Monitor & Terminal</button>
            <button class="tab-btn" id="btn-tab-dataset" onclick="switchMainTab('dataset')">Hasil Dataset</button>
            <button class="btn-run" onclick="triggerRunGenerator()">▶ Mulai</button>
            <button class="btn-stop" onclick="triggerStopGenerator()">⏹ Stop</button>
            <button class="btn-logout" onclick="handleLogout()" title="Keluar sesi">Keluar</button>
        </div>
    </header>

    <!-- TAB 1: WORKSPACE (LIVE SCREEN & MULTI TERMINAL) -->
    <div class="workspace" id="workspace-tab">
        <!-- Live Screen Column -->
        <div class="left-col">
            <div class="section-bar">
                <span>LIVE SCREEN</span>
                <div class="screen-toolbar">
                    <button class="btn-tool active-off" id="btn-screen-power" onclick="toggleScreenPower()">○ Screen: MATI</button>
                    <span style="color:#475569;">|</span>
                    <button class="btn-tool active-mode" id="btn-mode-live" onclick="setScreenMode('live')">Mode Live Saja</button>
                    <button class="btn-tool" id="btn-mode-anydesk" onclick="setScreenMode('anydesk')">Mode AnyDesk</button>
                </div>
            </div>
            <div class="screen-container">
                <div class="screen-stage" id="screen-stage">
                    <img id="live-screen" src="" alt="Live Stream">
                    <div id="screen-overlay" class="mode-live" tabindex="0"></div>
                </div>
                <div class="screen-off-placeholder show" id="screen-off-box">
                    <svg width="40" height="40" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18.364 18.364A9 9 0 005.636 5.636m12.728 12.728A9 9 0 015.636 5.636m12.728 12.728L5.636 5.636"></path></svg>
                    <span>Live Screen Dimatikan (Default Hemat Resource)</span>
                    <button class="btn-tool active-on" style="margin-top:4px;" onclick="toggleScreenPower()">Nyalakan Layar</button>
                </div>
            </div>
        </div>

        <!-- Multi Terminal Column -->
        <div class="right-col">
            <div class="section-bar">
                <span>REMOTE TERMINAL</span>
                <span id="active-terminal-badge" style="font-size:0.72rem; color:#38bdf8; background:#0c4a6e; padding:2px 8px; border-radius:4px; font-weight:700;">Aktif: Terminal 1</span>
            </div>
            <div class="terminal-tabs" id="term-tabs-bar">
                <button class="btn-add-term" onclick="addNewTerminal()" title="Buka Terminal Baru">+</button>
            </div>
            <div class="terminal-body">
                <div class="term-view" id="active-term-output"></div>
                <div class="term-cmd-bar">
                    <input type="text" class="term-cmd-input" id="term-input" placeholder="Ketik perintah terminal di folder saat ini..." onkeydown="handleTerminalKey(event)">
                    <button class="term-send-btn" onclick="sendTerminalCommand()">Kirim</button>
                </div>
            </div>
        </div>
    </div>

    <!-- TAB 2: DATASET VIEWER -->
    <div class="dataset-panel" id="dataset-panel">
        <div class="dataset-stats">
            <div class="stat-card">
                <span class="stat-val" id="stat-total">0</span>
                <span class="stat-lbl">Total Data Tersimpan</span>
            </div>
            <div class="progress-box">
                <div style="display: flex; justify-content: space-between; font-size: 0.72rem; color: #94a3b8; margin-bottom: 4px;">
                    <span>Progress: <strong id="progress-text">0 / 2500</strong></span>
                    <span id="progress-percent">0%</span>
                </div>
                <div class="progress-bar-bg">
                    <div class="progress-bar-fill" id="progress-fill"></div>
                </div>
            </div>
            <button class="tab-btn" onclick="fetchDatasetData()">🔄 Refresh Data</button>
        </div>
        <div class="dataset-list" id="dataset-list">
            <div style="text-align: center; color: #64748b; margin-top: 40px;">Memuat data...</div>
        </div>
    </div>

    <script>
        // =====================================================================
        // AUTHENTICATION GUARD (Otomatis diarahkan ke /login jika belum login)
        // =====================================================================
        const token = localStorage.getItem("token") || localStorage.getItem("skripsi_auth_token");
        if (!token) {
            window.location.replace("/login");
        }

        function handleLogout() {
            localStorage.removeItem("token");
            localStorage.removeItem("skripsi_auth_token");
            if (typeof isScreenPoweredOn !== 'undefined' && isScreenPoweredOn) toggleScreenPower();
            window.location.replace("/login");
        }

        // =====================================================================
        // SOCKET.IO & APPLICATION STATE
        // =====================================================================
        const socket = io();
        let activeTermId = null;
        let terminalsData = {}; 

        let isScreenPoweredOn = false;
        let currentScreenMode = "live";

        socket.on("connect", () => {
            const sp = document.getElementById("socket-pill");
            sp.innerText = "ONLINE";
            sp.className = "status-pill pill-green";
        });
        socket.on("disconnect", () => {
            const sp = document.getElementById("socket-pill");
            sp.innerText = "OFFLINE";
            sp.className = "status-pill pill-red";
        });
        socket.on("model_status", (data) => {
            const mp = document.getElementById("model-pill");
            mp.innerText = data.message;
            mp.className = data.loaded ? "status-pill pill-green" : "status-pill pill-yellow";
        });

        // =====================================================================
        // SCREEN CONTROLLER & NORMALIZATION
        // =====================================================================
        const img = document.getElementById("live-screen");
        const overlay = document.getElementById("screen-overlay");
        const offBox = document.getElementById("screen-off-box");
        const btnPower = document.getElementById("btn-screen-power");
        const btnAnydesk = document.getElementById("btn-mode-anydesk");
        const btnLive = document.getElementById("btn-mode-live");

        function toggleScreenPower() {
            isScreenPoweredOn = !isScreenPoweredOn;
            socket.emit("toggle_screen", { enabled: isScreenPoweredOn });
            
            if (isScreenPoweredOn) {
                btnPower.innerText = "● Screen: NYALA";
                btnPower.className = "btn-tool active-on";
                offBox.classList.remove("show");
            } else {
                btnPower.innerText = "○ Screen: MATI";
                btnPower.className = "btn-tool active-off";
                offBox.classList.add("show");
                img.src = "";
            }
        }

        function setScreenMode(mode) {
            currentScreenMode = mode;
            if (mode === "anydesk") {
                btnAnydesk.className = "btn-tool active-mode";
                btnLive.className = "btn-tool";
                overlay.className = "mode-anydesk";
            } else {
                btnLive.className = "btn-tool active-mode";
                btnAnydesk.className = "btn-tool";
                overlay.className = "mode-live";
            }
        }

        socket.on("screen_frame", (data) => {
            if (isScreenPoweredOn) {
                img.src = "data:image/jpeg;base64," + data.image;
            }
        });

        function getNormalizedCoords(e) {
            const rect = overlay.getBoundingClientRect();
            if (rect.width <= 0 || rect.height <= 0) return { x: 0, y: 0 };
            const clientX = e.clientX !== undefined ? e.clientX : (e.touches ? e.touches[0].clientX : 0);
            const clientY = e.clientY !== undefined ? e.clientY : (e.touches ? e.touches[0].clientY : 0);
            return {
                x: Math.max(0, Math.min(1, (clientX - rect.left) / rect.width)),
                y: Math.max(0, Math.min(1, (clientY - rect.top) / rect.height))
            };
        }

        let lastMouseMoveTime = 0;
        overlay.addEventListener("mousemove", (e) => {
            if (!isScreenPoweredOn || currentScreenMode !== "anydesk") return;
            const now = performance.now();
            if (now - lastMouseMoveTime < 28) return;
            lastMouseMoveTime = now;
            const c = getNormalizedCoords(e);
            socket.emit("mouse_control", { action: "move", x: c.x, y: c.y });
        });

        overlay.addEventListener("mousedown", (e) => {
            if (!isScreenPoweredOn || currentScreenMode !== "anydesk") return;
            overlay.focus();
            const c = getNormalizedCoords(e);
            const btn = e.button === 2 ? "right" : (e.button === 1 ? "middle" : "left");
            socket.emit("mouse_control", { action: "mousedown", button: btn, x: c.x, y: c.y });
        });

        overlay.addEventListener("mouseup", (e) => {
            if (!isScreenPoweredOn || currentScreenMode !== "anydesk") return;
            const c = getNormalizedCoords(e);
            const btn = e.button === 2 ? "right" : (e.button === 1 ? "middle" : "left");
            socket.emit("mouse_control", { action: "mouseup", button: btn, x: c.x, y: c.y });
        });

        overlay.addEventListener("contextmenu", (e) => {
            if (isScreenPoweredOn && currentScreenMode === "anydesk") {
                e.preventDefault();
            }
        });

        overlay.addEventListener("dblclick", (e) => {
            if (!isScreenPoweredOn || currentScreenMode !== "anydesk") return;
            const c = getNormalizedCoords(e);
            socket.emit("mouse_control", { action: "dblclick", x: c.x, y: c.y });
        });

        overlay.addEventListener("wheel", (e) => {
            if (!isScreenPoweredOn || currentScreenMode !== "anydesk") return;
            e.preventDefault();
            socket.emit("mouse_control", { action: "scroll", deltaY: e.deltaY, deltaX: e.deltaX });
        }, { passive: false });

        overlay.addEventListener("keydown", (e) => {
            if (!isScreenPoweredOn || currentScreenMode !== "anydesk") return;
            const preventKeys = ["Tab","Backspace","Delete","Home","End","PageUp","PageDown",
                                 "ArrowUp","ArrowDown","ArrowLeft","ArrowRight"," "];
            if (preventKeys.includes(e.key) || e.ctrlKey || e.altKey || e.metaKey) {
                e.preventDefault();
            }
            socket.emit("keyboard_control", {
                key: e.key,
                text: (e.key.length === 1 && !e.ctrlKey && !e.altKey && !e.metaKey) ? e.key : null,
                modifiers: { ctrl: e.ctrlKey, alt: e.altKey, shift: e.shiftKey, meta: e.metaKey }
            });
        });

        // ── Touch / Pointer events (mobile & tablet AnyDesk) ─────────────
        let touchStartDist = 0;
        let isDragging = false;

        overlay.addEventListener("touchstart", (e) => {
            if (!isScreenPoweredOn || currentScreenMode !== "anydesk") return;
            e.preventDefault();
            if (e.touches.length === 2) {
                const dx = e.touches[1].clientX - e.touches[0].clientX;
                const dy = e.touches[1].clientY - e.touches[0].clientY;
                touchStartDist = Math.hypot(dx, dy);
            } else {
                const c = getNormalizedCoords(e);
                socket.emit("mouse_control", { action: "mousedown", button: "left", x: c.x, y: c.y });
                isDragging = true;
            }
        }, { passive: false });

        overlay.addEventListener("touchmove", (e) => {
            if (!isScreenPoweredOn || currentScreenMode !== "anydesk") return;
            e.preventDefault();
            if (e.touches.length === 2) {
                const dx = e.touches[1].clientX - e.touches[0].clientX;
                const dy = e.touches[1].clientY - e.touches[0].clientY;
                const dist = Math.hypot(dx, dy);
                const delta = (dist - touchStartDist) * 0.5;
                touchStartDist = dist;
                socket.emit("mouse_control", { action: "scroll_zoom", delta });
            } else {
                const c = getNormalizedCoords(e);
                socket.emit("mouse_control", { action: "move", x: c.x, y: c.y });
            }
        }, { passive: false });

        overlay.addEventListener("touchend", (e) => {
            if (!isScreenPoweredOn || currentScreenMode !== "anydesk") return;
            e.preventDefault();
            if (isDragging) {
                const t = e.changedTouches[0];
                const rect = overlay.getBoundingClientRect();
                const cx = Math.max(0, Math.min(1, (t.clientX - rect.left) / rect.width));
                const cy = Math.max(0, Math.min(1, (t.clientY - rect.top) / rect.height));
                socket.emit("mouse_control", { action: "mouseup", button: "left", x: cx, y: cy });
                isDragging = false;
            }
        }, { passive: false });

        // =====================================================================
        // MULTI-TERMINAL MANAGEMENT & ACCURATE TAB ACTIVE/HOVER
        // =====================================================================
        let currentTerminalsList = [];

        socket.on("terminals_list", (data) => {
            currentTerminalsList = data.terminals || [];
            if (activeTermId === null && currentTerminalsList.length > 0) {
                activeTermId = currentTerminalsList[0].id;
            } else if (activeTermId && !currentTerminalsList.some(t => t.id === activeTermId)) {
                activeTermId = currentTerminalsList.length > 0 ? currentTerminalsList[0].id : null;
            }
            renderTerminalTabs();
            renderActiveTerminal();
        });

        socket.on("terminal_created", (data) => {
            activeTermId = data.id;
            if (!terminalsData[data.id]) {
                terminalsData[data.id] = { name: data.name, logs: "" };
            }
            renderTerminalTabs();
            renderActiveTerminal();
        });

        function renderTerminalTabs() {
            const tabsBar = document.getElementById("term-tabs-bar");
            if (!tabsBar) return;
            tabsBar.innerHTML = "";

            currentTerminalsList.forEach((term) => {
                if (!terminalsData[term.id]) {
                    terminalsData[term.id] = { name: term.name, logs: "" };
                }

                const tab = document.createElement("div");
                const isActive = (term.id === activeTermId);
                tab.className = "term-tab" + (isActive ? " active" : "");
                tab.dataset.tid = term.id;
                tab.onclick = () => selectTerminal(term.id);
                tab.innerHTML = `
                    <span>${term.name}</span>
                    <button class="term-close" onclick="closeTerminal(event, '${term.id}')" title="Tutup terminal">✕</button>
                `;
                tabsBar.appendChild(tab);
            });

            const addBtn = document.createElement("button");
            addBtn.className = "btn-add-term";
            addBtn.innerText = "+";
            addBtn.title = "Buka Terminal Baru";
            addBtn.onclick = addNewTerminal;
            tabsBar.appendChild(addBtn);

            updateActiveTerminalIndicator();
        }

        function updateActiveTerminalIndicator() {
            const badge = document.getElementById("active-terminal-badge");
            if (!badge) return;
            const current = currentTerminalsList.find(t => t.id === activeTermId);
            if (current) {
                badge.innerText = "Aktif: " + current.name;
            } else {
                badge.innerText = "Tidak ada terminal aktif";
            }
        }

        socket.on("terminal_output", (data) => {
            if (!terminalsData[data.term_id]) {
                terminalsData[data.term_id] = { name: "Terminal", logs: "" };
            }
            terminalsData[data.term_id].logs += data.data;

            if (data.term_id === activeTermId) {
                const out = document.getElementById("active-term-output");
                out.textContent += data.data;
                out.scrollTop = out.scrollHeight;
            }
        });

        function selectTerminal(tid) {
            activeTermId = tid;
            document.querySelectorAll(".term-tab").forEach(t => {
                if (t.dataset.tid === tid) {
                    t.classList.add("active");
                } else {
                    t.classList.remove("active");
                }
            });
            updateActiveTerminalIndicator();
            renderActiveTerminal();
        }

        function renderActiveTerminal() {
            const out = document.getElementById("active-term-output");
            if (activeTermId && terminalsData[activeTermId]) {
                out.textContent = terminalsData[activeTermId].logs;
                out.scrollTop = out.scrollHeight;
            }
        }

        function addNewTerminal() {
            socket.emit("new_terminal");
        }

        function closeTerminal(e, tid) {
            e.stopPropagation();
            socket.emit("close_terminal", { term_id: tid });
            delete terminalsData[tid];
            if (activeTermId === tid) {
                const remaining = currentTerminalsList.filter(t => t.id !== tid);
                activeTermId = remaining.length > 0 ? remaining[0].id : null;
            }
        }

        function sendTerminalCommand() {
            const input = document.getElementById("term-input");
            const val = input.value;
            if (val.trim() !== "" && activeTermId) {
                socket.emit("terminal_input", { term_id: activeTermId, command: val });
                input.value = "";
            }
        }

        function handleTerminalKey(e) {
            if (e.key === "Enter") sendTerminalCommand();
        }

        function triggerRunGenerator() {
            socket.emit("run_generator", { term_id: activeTermId });
            switchMainTab("monitor");
        }

        function triggerStopGenerator() {
            socket.emit("stop_generator", { term_id: activeTermId });
        }

        // =====================================================================
        // DATASET VIEWER (HASIL_DATASET\synthetic_rapor_dataset.jsonl)
        // =====================================================================
        function switchMainTab(tab) {
            const ws = document.getElementById("workspace-tab");
            const ds = document.getElementById("dataset-panel");
            const btnM = document.getElementById("btn-tab-monitor");
            const btnD = document.getElementById("btn-tab-dataset");

            if (tab === "monitor") {
                ws.style.display = window.innerWidth <= 980 ? "flex" : "grid";
                ds.classList.remove("active");
                btnM.classList.add("active");
                btnD.classList.remove("active");
            } else {
                ws.style.display = "none";
                ds.classList.add("active");
                btnM.classList.remove("active");
                btnD.classList.add("active");
                fetchDatasetData();
            }
        }

        async function fetchDatasetData() {
            const listContainer = document.getElementById("dataset-list");
            try {
                const res = await fetch("/api/dataset?limit=20");
                const data = await res.json();

                document.getElementById("stat-total").innerText = data.total;
                const target = 2500;
                document.getElementById("progress-text").innerText = `${data.total} / ${target}`;
                const pct = Math.min(100, ((data.total / target) * 100)).toFixed(1);
                document.getElementById("progress-percent").innerText = `${pct}%`;
                document.getElementById("progress-fill").style.width = `${pct}%`;

                if (data.rows.length === 0) {
                    listContainer.innerHTML = '<div style="text-align: center; color: #64748b; margin-top: 40px;">Belum ada data di HASIL_DATASET/synthetic_rapor_dataset.jsonl</div>';
                    return;
                }

                listContainer.innerHTML = "";
                data.rows.forEach((row, i) => {
                    const card = document.createElement("div");
                    card.className = "data-card";
                    card.innerHTML = `
                        <div class="card-header">
                            <span class="tag-capaian">${row.status_capaian || "Status"}</span>
                            <span style="color:#64748b; font-size:0.75rem;">Item #${data.total - i}</span>
                        </div>
                        <div class="section-label">Skenario:</div>
                        <div class="card-text">${row.skenario || "-"}</div>
                        <div class="section-label">Observasi:</div>
                        <div class="card-text">${row.observasi || "-"}</div>
                        <div class="section-label">Narasi Rapor (5 Poin):</div>
                        <div class="card-text">${row.narasi || "-"}</div>
                    `;
                    listContainer.appendChild(card);
                });
            } catch (err) {
                listContainer.innerHTML = `<div style="color: #ef4444; text-align: center;">Gagal memuat dataset: ${err.message}</div>`;
            }
        }
    </script>
</body>
</html>
